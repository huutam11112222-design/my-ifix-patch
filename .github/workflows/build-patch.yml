name: Build IFix Patch with Unity

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - name: Run IFix GenPatch
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2019.4.40f1
          targetPlatform: Android
          buildMethod: IFix.Editor.IFixEditor.GenPatch
          allowDirtyBuild: true

      - name: Find patch files
        run: |
          echo "=== Searching for .bytes files ==="
          find . -name "*.bytes" -o -name "*.patch.bytes" 2>/dev/null
          echo "=== End ==="

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifix-patch-output
          path: |
            **/*.patch.bytes
            **/*.bytes
          if-no-files-found: warn
          retention-days: 30
